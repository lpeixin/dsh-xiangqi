# Bundle patch for dsh-xiangqi-mate.
#
# One insert over the profile root. The row is addressed by id, so a user's own
# cordis.patch.yml can re-configure or disable it later:
#
#   - id: xiangqi
#     disabled: true
#
#   - id: xiangqi
#     config: { opponent: { mode: local } }
#
# NOTE: a patch replaces the targeted row's whole `config` rather than merging
# into it, so always restate every key you want to keep.
#
# The host half imports nothing outside Node built-ins and ships no
# dependencies, so it needs no dependency row and cannot break composition when
# unrelated packages are missing.

- insert:
    - id: xiangqi
      name: 'dsh-xiangqi-mate'
